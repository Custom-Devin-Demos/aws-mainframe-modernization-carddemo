name: online-ci

on:
  pull_request:
    paths:
      - 'app-java-online/**'
      - '.github/workflows/online-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app-java-online/**'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-java-online/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-java-online/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-java-online/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
