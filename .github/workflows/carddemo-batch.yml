name: carddemo-batch

on:
  pull_request:
    paths:
      - "app/java/carddemo-batch/**"
      - "app/data/ASCII/**"
      - ".github/workflows/carddemo-batch.yml"
  push:
    branches: [main]
    paths:
      - "app/java/carddemo-batch/**"
      - "app/data/ASCII/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/java/carddemo-batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run parity tests
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/java/carddemo-batch/**/target/surefire-reports/
          if-no-files-found: ignore
